name: FastDeviceRunner
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  FastDeviceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fast.device.runner
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: UITests/FastDeviceUITests-Bridging-Header.h
schemes:
  FastDevice:
    build:
      targets:
        FastDeviceUITests: [test]
    test:
      targets: [FastDeviceUITests]
